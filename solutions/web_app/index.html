<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>IOE Electrical Circuits & Machines (EE 154) — Master Solutions</title>
  <meta name="description" content="Minimalist, comprehensive Question-by-Question Master Solutions for Tribhuvan University IOE Electrical Circuits & Machines (ENEE 154 / EE 154).">
  
  <!-- Minimalist Black & White Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- KaTeX Mathematical Engine -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="nav-toggle-btn" id="sidebar-toggle-btn" title="Toggle Navigation Sidebar (M)" aria-label="Toggle Navigation">
        ☰
      </button>
      <div class="brand-block">
        <div class="brand-title">IOE Circuits & Machines</div>
        <div class="brand-meta">EE 154 / ENEE 154 · MASTER SOLUTIONS</div>
      </div>
    </div>

    <div class="header-right">
      <!-- Search Trigger -->
      <button class="header-action-btn" id="search-trigger-btn" title="Search Database (⌘K)">
        <span>Search</span>
        <span class="mono" style="font-size: 0.7rem; color: var(--text-muted);">/</span>
      </button>

      <!-- Formula Cheatsheet -->
      <button class="header-action-btn hide-on-mobile" id="formula-trigger-btn" title="Formula Reference (F)">
        <span>Formulas</span>
      </button>

      <!-- PDF Download -->
      <a href="../Electrical_Circuits_and_Machines_Solutions_Master.pdf" class="header-action-btn solid hide-on-mobile" target="_blank" download title="Download 55-Page PDF Book">
        <span>PDF</span>
      </a>

      <!-- Theme Switcher -->
      <button class="icon-action-btn" id="theme-toggle-btn" title="Toggle Black / White Mode (T)">
        <span id="theme-icon" style="font-size: 0.75rem; font-family: var(--font-mono); font-weight: 700;">DARK</span>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="app-layout">
    
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Navigation Sidebar Drawer -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-top-bar">
        <span class="sidebar-section-label">Exam Session Filter</span>
        <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close Sidebar">Close ✕</button>
      </div>

      <!-- Year Filter Row -->
      <div class="year-filter-wrapper">
        <button class="filter-chip active" data-year="ALL">ALL YEARS</button>
        <button class="filter-chip" data-year="2083 BAISHAKH">2083 BSK</button>
        <button class="filter-chip" data-year="2082 BHADRA">2082 BHD</button>
        <button class="filter-chip" data-year="2082 BAISHAKH">2082 BSK</button>
        <button class="filter-chip" data-year="2081 ASHWIN">2081 ASH</button>
      </div>

      <div class="sidebar-top-bar">
        <span class="sidebar-section-label">Questions (Q1 — Q10)</span>
      </div>

      <!-- Question List Container -->
      <nav class="sidebar-nav-list" id="sidebar-nav-list">
        <!-- Injected via app.js -->
      </nav>
    </aside>

    <!-- Main Content Viewport -->
    <main class="app-content" id="main-content">
      <div style="padding: 4rem 1rem; text-align: center; color: var(--text-muted); font-family: var(--font-mono);">
        Loading Question Database...
      </div>
    </main>

  </div>

  <!-- Mobile Bottom Floating Navigation Bar -->
  <nav class="mobile-bottom-bar" id="mobile-bottom-bar">
    <button class="mobile-bottom-bar-btn" id="mobile-menu-btn">
      <span style="font-size: 1.1rem;">☰</span>
      <span>Menu</span>
    </button>
    <button class="mobile-bottom-bar-btn" id="mobile-prev-btn">
      <span style="font-size: 1.1rem;">←</span>
      <span>Prev</span>
    </button>
    <button class="mobile-bottom-bar-btn" id="mobile-next-btn">
      <span style="font-size: 1.1rem;">→</span>
      <span>Next</span>
    </button>
    <button class="mobile-bottom-bar-btn" id="mobile-search-btn">
      <span style="font-size: 1.1rem;">⌕</span>
      <span>Search</span>
    </button>
    <button class="mobile-bottom-bar-btn" id="mobile-formula-btn">
      <span style="font-size: 1.1rem;">∑</span>
      <span>Formulas</span>
    </button>
  </nav>

  <!-- Search Modal -->
  <div class="modal-overlay" id="search-modal-backdrop">
    <div class="modal-card">
      <div class="modal-card-header">
        <span class="modal-card-title">Search Question Bank</span>
        <button class="icon-action-btn" id="search-close-btn" style="width: 32px; height: 32px;">✕</button>
      </div>
      <div class="modal-card-body">
        <div class="search-field-box">
          <span>⌕</span>
          <input type="text" id="search-input-field" class="search-input-text" placeholder="Search by topic, year, formula, or keyword..." autocomplete="off" />
        </div>
        <div id="search-results-list">
          <!-- Search results injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Engineering Formula Reference Modal -->
  <div class="modal-overlay" id="formula-modal-backdrop">
    <div class="modal-card" style="max-width: 820px;">
      <div class="modal-card-header">
        <span class="modal-card-title">Formula Reference & Models</span>
        <button class="icon-action-btn" id="formula-close-btn" style="width: 32px; height: 32px;">✕</button>
      </div>
      <div class="modal-card-body" id="formula-modal-body">
        <!-- Formulas injected via JS -->
      </div>
    </div>
  </div>

  <!-- Diagram Lightbox Zoom Modal -->
  <div class="modal-overlay" id="lightbox-backdrop">
    <div style="position: relative; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;">
      <button class="icon-action-btn" id="lightbox-close-btn" style="position: absolute; top: -45px; right: 0; background: black; color: white; border: 1px solid white;">✕</button>
      <img id="lightbox-image" src="" alt="High-Resolution Schematic" style="max-width: 100%; max-height: 80vh; border: 2px solid black; background: white; padding: 1rem;" />
      <div id="lightbox-caption" style="margin-top: 0.5rem; color: white; font-family: var(--font-mono); font-size: 0.85rem;"></div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="js/app.js"></script>

</body>
</html>
